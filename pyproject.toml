[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
# Keep the first CI gate focused on pycodestyle/pyflakes correctness. Import
# sorting, pyupgrade rewrites, bugbear, simplify, and broad line wrapping are
# intentionally deferred so this PR does not create repo-wide churn before the
# bridge refactor/packaging work.
ignore = ["E501"]

[tool.ruff.lint.mccabe]
# Complexity regression gate (issue #348): new functions above CC 15 fail CI.
# Pre-existing hotspots carry an explicit, per-function `# noqa: C901`
# baseline marker so the exception list stays review-visible in the diff that
# touches it; do not add new markers without refactoring being infeasible.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# These files deliberately patch sys.modules/sys.path or bootstrap the script
# before importing runtime modules; keep the exception scoped and auditable.
"bridge/tests/test_duration_log.py" = ["E402"]
"bridge/tests/test_heartbeat_format.py" = ["E402"]
"scripts/agent_cron.py" = ["E402"]
"tests/test_jevlib.py" = ["E402"]

[tool.pytest.ini_options]
# Root-level discovery (#1528 2026-09-24 재평가, 항목 5). Before this block a
# bare `pytest` at the repo root collected nothing, and the repo carried two
# python test naming conventions side by side: `tests/test_*.py` (pytest
# style) and `scripts/**/*_test.py` (unittest style, run one file per line
# from validate-harness.sh or a sibling *.test.sh wrapper). pytest only
# discovers `test_*.py` by default, so `pytest scripts/foo_test.py` worked
# but `pytest scripts/` silently skipped the `_test.py` files. Both patterns
# are collected now. `testpaths` stays on `tests/` only: the scripts/ suites
# are wired individually (see ci.yml python-lint and validate-harness.sh) and
# tests/test_scripts_test_collection.py fails on any file that is not.
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = [".github/pythonpath"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
mypy_path = "bridge"
explicit_package_bases = true
files = [
  "bridge/dependency_bootstrap.py",
  "bridge/core",
  "bridge/memory/codex_exec_backend.py",
  "bridge/memory/journal_core.py",
  "bridge/memory/distill_journal.py",
  "bridge/memory/distill_types.py",
  "bridge/memory/distill_worker.py",
  "bridge/memory/promotion.py",
  "bridge/tests/runtime_conformance.py",
  "bridge/tests/test_agent_runtime_contract.py",
  "bridge/tests/test_codex_app_server.py",
  "bridge/tests/test_codex_runtime.py",
  "bridge/tests/test_claude_unrestricted.py",
  "bridge/tests/test_provider_capabilities.py",
  "bridge/tests/test_runtime_conformance.py",
  "bridge/tests/test_usage_meter.py",
  "scripts/agent_cron_lib.py",
  "scripts/agent_cron_schema.py",
  "scripts/agent_cron_model.py",
  "scripts/agent_cron_repository.py",
  "scripts/ccc_architecture_contract.py",
  "scripts/ccc_side_effect_contract.py",
]
