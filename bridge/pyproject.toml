[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccc-telegram-bridge"
version = "0.1.0"
description = "Telegram bridge for ccc-node Claude Code harnesses"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot>=20.7",
  "telegramify-markdown>=0.5.0",
  "python-dotenv>=1.2.2",
  "pydantic>=2.4.0",
  "pydantic-settings>=2.2.0",
  "claude-agent-sdk>=0.2.110",
  "opentelemetry-api>=1.41.0",
  "opentelemetry-sdk>=1.41.0",
  "openai>=1.0.0",
]

[project.optional-dependencies]
# Mirrors requirements-voice.txt. Keep the extra small because the TOS uploader
# imports this optional native dependency lazily and many nodes do not need it.
voice = ["tos"]
dev = ["pytest", "pytest-cov"]

[tool.setuptools]
package-dir = {"telegram_bot" = "."}
packages = [
  "telegram_bot",
  "telegram_bot.core",
  "telegram_bot.memory",
  "telegram_bot.session",
  "telegram_bot.utils",
]
# There is no telegram_bot.hooks Python package in bridge/ today; repository
# hook scripts live under the top-level claude/hooks/ and are validated by
# scripts/validate-harness.sh rather than packaged into the Telegram bridge.

# Coverage regression gate (issue #348). Branch coverage is the gated metric —
# it catches untested deny/error/empty/no-match paths that line coverage
# hides. fail_under holds the measured baseline with a small buffer; the
# staged plan (72 → 75 → 80) is documented in docs/quality-baseline.md. CI
# runs pytest with --cov from bridge/, so this config applies to every gated
# coverage run.
# The tests import `telegram_bot`, which is this directory installed under its
# package name (see [tool.setuptools] package-dir above). Nothing inside the
# checkout is importable as `telegram_bot`, so a bare `pytest` has to find that
# name somewhere else on sys.path — and on any node that actually runs the
# bridge, it finds the DEPLOYED copy at /opt/ccc-node instead of the code under
# test. The failure is silent and cuts both ways: an older deployment reports
# failures the checkout does not have (observed: three test_distill_local_sink
# cases red on a clean main), and a deployment that is merely different reports
# green for code that never executed. A clean clone does not help, because the
# clone has no `telegram_bot` either.
#
# CI already resolves this with a checked-in shim — .github/pythonpath holds a
# `telegram_bot` symlink back to this directory — but it only worked there
# because the workflow exports PYTHONPATH by hand, which no local invocation
# does. Declaring it here makes the same shim the default for every run, so
# local and CI resolve the same package by construction rather than by
# remembering an env var. Relative to this file's directory, i.e. rootdir.
[tool.pytest.ini_options]
pythonpath = ["../.github/pythonpath"]
# Per-test wall-clock cap (pytest-timeout, locked CI-only via
# .github/requirements/bridge-ci.in). Generous by design: individual tests
# finish in well under a second, so 120s only catches genuine hangs and turns
# a stalled runner into a fast failure with a stack dump. Local runs without
# the plugin ignore this key (pytest warns about the unknown ini option).
timeout = 120

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 80
precision = 1
