# TEMPORARY (#2738): loop start-lib.test.sh on ubuntu-26.04. Removed before merge.
name: diag-2738
on:
  pull_request:
permissions:
  contents: read
jobs:
  loop:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Loop start-lib.test.sh x20
        env:
          TMPDIR: ${{ runner.temp }}/ccc-tmp
        run: |
          mkdir -p "$TMPDIR"; set +e; fails=0
          for i in $(seq 1 20); do
            out="$(TMPDIR=$(mktemp -d) bash bridge/start-lib.test.sh 2>&1)"
            echo "run $i: $(grep -E 'PASS=' <<<"$out" | tail -1)"
            if grep -q '^FAIL' <<<"$out"; then fails=$((fails+1)); grep -E '^FAIL|^diag ' <<<"$out" | cut -c1-600; fi
          done
          echo "failing-runs=$fails/20"
