# TEMPORARY (#2738): pid_max / pid wrap on GitHub runners. Removed before merge.
name: diag-2738
on:
  pull_request:
permissions:
  contents: read
jobs:
  diag:
    strategy:
      matrix:
        image: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 10
    steps:
      - name: pid_max and current pid
        run: |
          echo "image=${{ matrix.image }} pid_max=$(cat /proc/sys/kernel/pid_max) nproc=$(nproc) shell_pid=$$"
          ls /usr/lib/sysctl.d/ /etc/sysctl.d/ 2>/dev/null | tr '\n' ' '; echo
          grep -rh pid_max /usr/lib/sysctl.d /etc/sysctl.d 2>/dev/null
