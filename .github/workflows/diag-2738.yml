# TEMPORARY (#2738): is concurrent mkdir exclusive on ubuntu-26.04? Removed before merge.
name: diag-2738
on:
  pull_request:
permissions:
  contents: read
jobs:
  mkdir-race:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: N concurrent creators of one path, repeated
        run: |
          set +e
          trial() { # <label> <creator-cmd...>  -> rounds where more than one creator succeeded
            local label="$1"; shift; local multi=0 zero=0 r i d
            for r in $(seq 1 200); do
              d="$(mktemp -d)/claim"; : > "$d.go.unused"
              for i in $(seq 1 20); do ( "$@" "$d" && echo ok >> "$d.wins" ) 2>/dev/null & done; wait
              n=$(wc -l < "$d.wins" 2>/dev/null || echo 0)
              [ "$n" -gt 1 ] && multi=$((multi+1)); [ "$n" -eq 0 ] && zero=$((zero+1))
            done
            echo "$label: rounds-with-multiple-winners=$multi/200 zero=$zero"
          }
          excl() { ( set -C; : > "$1" ); }
          trial "uutils mkdir" mkdir
          trial "gnumkdir" /usr/bin/gnumkdir
          trial "bash noclobber" excl
          mkdir --version | head -1
