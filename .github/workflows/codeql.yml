name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # merge_group: queued PRs must re-report the codeql-python required
  # context on the queue's gh-readonly-queue/main/<pr>-<sha> group ref
  # (see ci-governance.md; same rationale as the ci.yml merge_group trigger).
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '33 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
    # Keep this exact name aligned with .github/required-checks.json.
    name: codeql-python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
