name: harness-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref (PR pushes); never cancel main builds.
# Every job carries timeout-minutes: without it a runner stalled on a package
# mirror blocks the PR for the 6h default (2026-08-19, run 32233059105).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # #1482: `bash scripts/validate-harness.sh` ran 15m42s on main (run
  # 33930573500) and was the sole critical path — 14m33s of it the sequential
  # hook-test loop. It is now split three ways:
  #   validate-harness-static   the non-test phases, once (CCC_HARNESS_PHASE=static)
  #   validate-harness-shard    the hook-test runs, bin-packed across a 4-way
  #                             matrix (CCC_HARNESS_SHARD=<i>/<n>; est. ~3.6 min each)
  #   validate-harness          pure aggregator: fails unless BOTH legs succeeded
  # The aggregator exists so the required-check context `validate-harness`
  # (.github/required-checks.json, tests/test_ci_required_contexts.py) keeps
  # its name and keeps gating main without a branch-protection change.
  validate-harness-static:
    name: validate-harness-static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install jq + shellcheck
        # A stalled Ubuntu mirror held this step 33 min (run 32233059105) and
        # again 20 min (run 32236249278) on 2026-08-19: apt's connection hangs
        # rather than erroring, so Retries alone never fires. Give each fetch a
        # 30 s timeout so a hang turns into a retry, and let the job timeout
        # above be the last line of defence.
        # 2026-08-19 follow-up: the Acquire timeouts did NOT trip two more
        # hangs (runs 32270679391, 32275899144 — apt stalled 20 min both
        # times), so the fetch-level knobs are insufficient for whatever apt
        # blocks on (DNS/IPv6/mirror stall). Bound each apt invocation at the
        # OS level with `timeout` and retry the pair; worst case stays under
        # the 20-min job timeout (3 x (120 + 240 + 5)s).
        env:
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get $APT_OPTS update -qq \
              && sudo timeout 240 apt-get $APT_OPTS install -y -qq jq shellcheck; then
              exit 0
            fi
            echo "apt attempt $attempt failed or hung; retrying" >&2
            sleep 5
          done
          echo "apt failed/hung after 3 attempts" >&2
          exit 1
      - name: Validate harness — static phase (JSON, shell syntax, shellcheck, py_compile, registration guard, frontmatter)
        env:
          TMPDIR: ${{ runner.temp }}/ccc-tmp
          CCC_HARNESS_PHASE: static
        run: |
          mkdir -p "$TMPDIR"
          bash scripts/validate-harness.sh

  validate-harness-shard:
    name: validate-harness-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Shard assignment (which suites this leg runs)
        env:
          CCC_HARNESS_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          CCC_HARNESS_LIST_ONLY: "1"
        run: bash scripts/validate-harness.sh
      - name: Install jq + shellcheck
        # Same bounded apt install as validate-harness-static — see the
        # rationale there (mirror stalls, 2026-08-19). Keep the two in sync.
        env:
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get $APT_OPTS update -qq \
              && sudo timeout 240 apt-get $APT_OPTS install -y -qq jq shellcheck; then
              exit 0
            fi
            echo "apt attempt $attempt failed or hung; retrying" >&2
            sleep 5
          done
          echo "apt failed/hung after 3 attempts" >&2
          exit 1
      - name: Validate harness — hook tests (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        env:
          TMPDIR: ${{ runner.temp }}/ccc-tmp
          CCC_HARNESS_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          mkdir -p "$TMPDIR"
          bash scripts/validate-harness.sh

  validate-harness:
    name: validate-harness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate-harness-static, validate-harness-shard]
    # Run even when a leg failed/was cancelled/was skipped, and fail unless
    # every leg is `success` — a skipped or cancelled leg must NOT pass the
    # required context (a matrix `result` is the aggregate over all legs).
    if: always()
    steps:
      - name: Gate on every validate-harness leg
        env:
          STATIC_RESULT: ${{ needs.validate-harness-static.result }}
          SHARD_RESULT: ${{ needs.validate-harness-shard.result }}
        run: |
          echo "validate-harness-static: $STATIC_RESULT"
          echo "validate-harness-shard (all legs): $SHARD_RESULT"
          if [ "$STATIC_RESULT" = success ] && [ "$SHARD_RESULT" = success ]; then
            echo "validate-harness: PASS"
          else
            echo "validate-harness: FAIL (a leg did not succeed)" >&2
            exit 1
          fi

  python-lint:
    name: python-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: .github/requirements/bridge-ci.txt
      - name: Install lint tools
        run: |
          python -m pip install --require-hashes -r .github/requirements/bridge-ci.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy (focused subset)
        env:
          PYTHONPATH: ${{ github.workspace }}/.github/pythonpath
        run: mypy
      - name: Owner-operator production contract
        working-directory: bridge
        env:
          TMPDIR: ${{ runner.temp }}/ccc-tmp
          PYTHONPATH: ${{ github.workspace }}/.github/pythonpath
        run: |
          mkdir -p "$TMPDIR"
          python -m pytest -q tests/test_owner_operator_contract.py
      - name: CI hardening regressions
        run: python -m pytest -q tests/test_ci_pip_hash_pinning.py tests/test_workflow_permissions.py tests/test_codeowners_branch_protection.py tests/test_ci_required_contexts.py tests/test_owner_operator_ci_gate.py tests/test_runtime_deps_lock.py tests/test_coverage_floor_gate.py
      - name: Research contract regressions
        # tests/ has no conftest/pytest.ini collecting it wholesale, so a root
        # test file not named in a step runs nowhere. This one anchors the
        # research/ evaluator contract and was orphaned since it landed.
        run: python -m pytest -q tests/test_autoresearch_streaming.py

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Gitleaks
        run: gitleaks detect --source . -c .gitleaks.toml --no-banner

  bridge-tests:
    name: bridge-tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: .github/requirements/bridge-ci.txt
      - name: Install bridge
        run: |
          python -m pip install --require-hashes -r .github/requirements/bridge-ci.txt
      - name: Run bridge tests with coverage
        working-directory: bridge
        env:
          TMPDIR: ${{ runner.temp }}/ccc-tmp
          PYTHONPATH: ${{ github.workspace }}/.github/pythonpath
        run: |
          mkdir -p "$TMPDIR"
          # Coverage is a GATE, not report-only: pytest-cov enforces the branch
          # coverage floor from [tool.coverage.report] fail_under in
          # bridge/pyproject.toml (single-sourced so both matrix legs agree and
          # there is no drift-prone duplicate flag). A run below the floor exits
          # non-zero and fails this job. Raising the floor / the ratchet lives in
          # #348; the gate is regression-pinned by tests/test_coverage_floor_gate.py.
          python -m pytest -q --cov=telegram_bot --cov-report=term --cov-report=xml
      - name: Umask-0002 variant (permission-contract suites)
        working-directory: bridge
        env:
          TMPDIR: ${{ runner.temp }}/ccc-tmp-0002
          PYTHONPATH: ${{ github.workspace }}/.github/pythonpath
        run: |
          mkdir -p "$TMPDIR"
          # #779: these suites pin fixture permissions against the fail-closed
          # filesystem contracts; run them under umask 0002 so a fixture that
          # re-inherits the ambient umask fails in CI (default umask 0022).
          (umask 0002; python -m pytest -q \
            tests/test_memory_hook_policy.py \
            tests/test_memory_promotion.py \
            tests/test_secure_fs_module.py \
            tests/test_task_ledger.py)
      - name: Upload bridge coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bridge-coverage
          path: bridge/coverage.xml

  wheel-smoke:
    name: wheel-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            .github/requirements/bridge-ci.txt
            bridge/requirements.lock.txt
      - name: Install verification tools (hash-locked)
        run: |
          python -m pip install --require-hashes -r .github/requirements/bridge-ci.txt
      - name: Build bridge wheel (no isolation — backend pinned in the CI lock)
        run: python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/dist" bridge
      - name: Install wheel into a clean venv (hash-locked runtime deps)
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install --require-hashes -r bridge/requirements.lock.txt
          "$RUNNER_TEMP/wheel-venv/bin/pip" install --no-deps "$RUNNER_TEMP"/dist/*.whl
      - name: Import and config smoke (outside the source tree)
        working-directory: ${{ runner.temp }}
        env:
          TELEGRAM_BOT_TOKEN: "123456:wheel-smoke-placeholder"
          ALLOWED_USER_IDS: "1"
          PROJECT_ROOT: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import telegram_bot
          import telegram_bot.core.bot
          import telegram_bot.core.project_chat
          from telegram_bot.utils.config import Settings

          assert "site-packages" in telegram_bot.__file__, telegram_bot.__file__
          settings = Settings()
          assert settings.allowed_user_ids == [1]
          print("wheel import/config smoke OK:", telegram_bot.__file__)
          PY
      - name: pip check (clean venv)
        run: '"$RUNNER_TEMP/wheel-venv/bin/pip" check'
      - name: pip-audit (hash-locked runtime set)
        run: pip-audit --require-hashes --disable-pip -r bridge/requirements.lock.txt
