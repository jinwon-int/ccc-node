name: harness-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref (PR pushes); never cancel main builds.
# Every job carries timeout-minutes: without it a runner stalled on a package
# mirror blocks the PR for the 6h default (2026-08-19, run 32233059105).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-harness:
    name: validate-harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install jq + shellcheck
        # A stalled Ubuntu mirror held this step 33 min (run 32233059105) and
        # again 20 min (run 32236249278) on 2026-08-19: apt's connection hangs
        # rather than erroring, so Retries alone never fires. Give each fetch a
        # 30 s timeout so a hang turns into a retry, and let the job timeout
        # above be the last line of defence.
        #
        # #1190: even with those fetch timeouts the step still hung twice more
        # the same day (runs 32268948479 / 32272588603, both canceled at the
        # 20-min job timeout with zero apt output) — the stall sits outside
        # Acquire's coverage (dpkg/apt lock wait, pre-download resolver), so
        # bound the INVOCATION itself: `timeout` turns the hang into a
        # retryable failure, and the step cap keeps a fully wedged apt from
        # eating the job budget.
        timeout-minutes: 5
        env:
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          rc=1
          for attempt in 1 2 3; do
            if timeout 90 sudo apt-get $APT_OPTS update -qq \
              && timeout 90 sudo apt-get $APT_OPTS install -y -qq jq shellcheck; then
              rc=0
              break
            fi
            echo "apt attempt $attempt failed or timed out — retrying"
            sleep 5
          done
          [ "$rc" = 0 ] || { echo "apt install failed after 3 attempts"; exit 1; }
          jq --version
          shellcheck --version | head -2
      - name: Validate harness (JSON, shell syntax, shellcheck, hook tests, frontmatter)
        env:
          TMPDIR: ${{ runner.temp }}/ccc-tmp
        run: |
          mkdir -p "$TMPDIR"
          bash scripts/validate-harness.sh

  python-lint:
    name: python-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: .github/requirements/bridge-ci.txt
      - name: Install lint tools
        run: |
          python -m pip install --require-hashes -r .github/requirements/bridge-ci.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy (focused subset)
        env:
          PYTHONPATH: ${{ github.workspace }}/.github/pythonpath
        run: mypy
      - name: Owner-operator production contract
        working-directory: bridge
        env:
          TMPDIR: ${{ runner.temp }}/ccc-tmp
          PYTHONPATH: ${{ github.workspace }}/.github/pythonpath
        run: |
          mkdir -p "$TMPDIR"
          python -m pytest -q tests/test_owner_operator_contract.py
      - name: CI hardening regressions
        run: python -m pytest -q tests/test_ci_pip_hash_pinning.py tests/test_workflow_permissions.py tests/test_codeowners_branch_protection.py tests/test_ci_required_contexts.py tests/test_owner_operator_ci_gate.py tests/test_runtime_deps_lock.py tests/test_coverage_floor_gate.py

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Gitleaks
        run: gitleaks detect --source . -c .gitleaks.toml --no-banner

  bridge-tests:
    name: bridge-tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: .github/requirements/bridge-ci.txt
      - name: Install bridge
        run: |
          python -m pip install --require-hashes -r .github/requirements/bridge-ci.txt
      - name: Run bridge tests with coverage
        working-directory: bridge
        env:
          TMPDIR: ${{ runner.temp }}/ccc-tmp
          PYTHONPATH: ${{ github.workspace }}/.github/pythonpath
        run: |
          mkdir -p "$TMPDIR"
          # Coverage is a GATE, not report-only: pytest-cov enforces the branch
          # coverage floor from [tool.coverage.report] fail_under in
          # bridge/pyproject.toml (single-sourced so both matrix legs agree and
          # there is no drift-prone duplicate flag). A run below the floor exits
          # non-zero and fails this job. Raising the floor / the ratchet lives in
          # #348; the gate is regression-pinned by tests/test_coverage_floor_gate.py.
          python -m pytest -q --cov=telegram_bot --cov-report=term --cov-report=xml
      - name: Umask-0002 variant (permission-contract suites)
        working-directory: bridge
        env:
          TMPDIR: ${{ runner.temp }}/ccc-tmp-0002
          PYTHONPATH: ${{ github.workspace }}/.github/pythonpath
        run: |
          mkdir -p "$TMPDIR"
          # #779: these suites pin fixture permissions against the fail-closed
          # filesystem contracts; run them under umask 0002 so a fixture that
          # re-inherits the ambient umask fails in CI (default umask 0022).
          (umask 0002; python -m pytest -q \
            tests/test_memory_hook_policy.py \
            tests/test_memory_promotion.py \
            tests/test_secure_fs_module.py \
            tests/test_task_ledger.py)
      - name: Upload bridge coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bridge-coverage
          path: bridge/coverage.xml

  wheel-smoke:
    name: wheel-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            .github/requirements/bridge-ci.txt
            bridge/requirements.lock.txt
      - name: Install verification tools (hash-locked)
        run: |
          python -m pip install --require-hashes -r .github/requirements/bridge-ci.txt
      - name: Build bridge wheel (no isolation — backend pinned in the CI lock)
        run: python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/dist" bridge
      - name: Install wheel into a clean venv (hash-locked runtime deps)
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install --require-hashes -r bridge/requirements.lock.txt
          "$RUNNER_TEMP/wheel-venv/bin/pip" install --no-deps "$RUNNER_TEMP"/dist/*.whl
      - name: Import and config smoke (outside the source tree)
        working-directory: ${{ runner.temp }}
        env:
          TELEGRAM_BOT_TOKEN: "123456:wheel-smoke-placeholder"
          ALLOWED_USER_IDS: "1"
          PROJECT_ROOT: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import telegram_bot
          import telegram_bot.core.bot
          import telegram_bot.core.project_chat
          from telegram_bot.utils.config import Settings

          assert "site-packages" in telegram_bot.__file__, telegram_bot.__file__
          settings = Settings()
          assert settings.allowed_user_ids == [1]
          print("wheel import/config smoke OK:", telegram_bot.__file__)
          PY
      - name: pip check (clean venv)
        run: '"$RUNNER_TEMP/wheel-venv/bin/pip" check'
      - name: pip-audit (hash-locked runtime set)
        run: pip-audit --require-hashes --disable-pip -r bridge/requirements.lock.txt
