version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Keep init/analyze on one commit so CodeQL never runs mixed action SHAs.
    groups:
      codeql-action-family:
        patterns:
          - github/codeql-action/*
  - package-ecosystem: pip
    # #349/#1483: bridge/requirements.lock.txt (runtime) and
    # .github/requirements/bridge-ci.txt (CI) are one logical lock pair that
    # scripts/ccc-deps-lock.sh DERIVES from bridge/pyproject.toml (the runtime
    # lock is compiled with the CI lock as a pip constraint), and
    # tests/test_runtime_deps_lock.py fails CI when their shared pins drift.
    # Dependabot cannot perform that derivation, and its groups do not span
    # directories, so every pip version PR it opened moved a pin in one lock
    # only and failed the pair test (#999-#1001, #1453-#1457, #1495). pip
    # VERSION updates are therefore disabled (open-pull-requests-limit: 0);
    # the weekly deps-lock workflow (.github/workflows/deps-lock.yml, via
    # scripts/ccc-deps-lock-pr.sh) regenerates the pair and opens one bot PR
    # per round instead — see docs/ci-governance.md. The block stays so
    # Dependabot SECURITY updates and alerts keep their pip configuration.
    directories:
      - /bridge
      - /.github
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      python-lock-pair:
        patterns:
          - "*"
    ignore:
      # pydantic-core is not a direct dependency of bridge/pyproject.toml; it is
      # transitive and pydantic pins it exactly (pydantic 2.13.4 requires
      # pydantic-core==2.46.4). Dependabot sees it only because it appears in the
      # lock files, so a standalone bump can never resolve — not on a rebase, and
      # not with a companion pydantic bump, because no released pydantic accepts a
      # newer core (#1015). The right core version arrives automatically when
      # pydantic bumps and scripts/ccc-deps-lock.sh regenerates the lock pair.
      # Nothing is lost security-wise: pydantic's exact pin means a pydantic-core
      # CVE cannot be taken independently either.
      - dependency-name: "pydantic-core"
