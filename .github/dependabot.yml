version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Keep init/analyze on one commit so CodeQL never runs mixed action SHAs.
    groups:
      codeql-action-family:
        patterns:
          - github/codeql-action/*
  - package-ecosystem: pip
    # #349: bridge/requirements.lock.txt (runtime) and
    # .github/requirements/bridge-ci.txt (CI) are one logical lock pair —
    # tests/test_runtime_deps_lock.py fails CI when their shared pins drift.
    # Listing both directories keeps every bump in a single PR that updates
    # the pair together (single-directory bumps broke this in #999-#1001).
    directories:
      - /bridge
      - /.github
    schedule:
      interval: weekly
    ignore:
      # pydantic-core is not a direct dependency of bridge/pyproject.toml; it is
      # transitive and pydantic pins it exactly (pydantic 2.13.4 requires
      # pydantic-core==2.46.4). Dependabot sees it only because it appears in the
      # lock files, so a standalone bump can never resolve — not on a rebase, and
      # not with a companion pydantic bump, because no released pydantic accepts a
      # newer core (#1015). The right core version arrives automatically when
      # pydantic bumps and scripts/ccc-deps-lock.sh regenerates the lock pair.
      # Nothing is lost security-wise: pydantic's exact pin means a pydantic-core
      # CVE cannot be taken independently either.
      - dependency-name: "pydantic-core"
